[project]
name = "space-apps-2026"
version = "0.1.0"
description = "Herramienta de análisis de iluminación y visibilidad lunar"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "astroquery>=0.4.11",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "spiceypy>=8.4.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
