name: Deployment checks
on:
  pull_request:
  push:
    branches: [main, deployment/jury-hybrid]
permissions:
  contents: read
concurrency:
  group: deployment-checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.20"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: data/kernels
          key: naif-kernels-v1-${{ hashFiles('ilargi/kernels.py') }}
      - run: uv run python -m ilargi.kernels
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: npm ci && npm --prefix web ci
      - run: npx --no-install prettier --check web/src web/e2e web/playwright.config.ts web/package.json docs/deployment .github/workflows/deployment-checks.yml
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: jury-static-site
          path: web/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: web/test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ilargi-api .
      - name: Verify container startup and scientific computation
        run: |
          docker run -d --name api -p 8080:8080 -e PORT=8080 ilargi-api
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/api/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/api/health
          curl --fail --max-time 120 http://localhost:8080/api/education/cycle \
            -H 'Content-Type: application/json' \
            -d '{"latitude_deg":0.674,"longitude_east_deg":23.473,"start_utc":"2026-04-02T15:00:00Z","duration_hours":12,"step_minutes":180}'
      - run: docker logs api
        if: always()
