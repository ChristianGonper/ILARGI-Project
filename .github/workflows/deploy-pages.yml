name: Publish jury frontend
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Deployment checks]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: jury-frontend-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm --prefix web ci
      - run: npm --prefix web run build
        env:
          VITE_DATA_MODE: ${{ vars.ILARGI_API_URL && 'auto' || 'static' }}
          VITE_API_BASE_URL: ${{ vars.ILARGI_API_URL }}
      - run: npx --no-install wrangler pages deploy web/dist --project-name ilargi-jury --branch deployment/jury-hybrid
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
