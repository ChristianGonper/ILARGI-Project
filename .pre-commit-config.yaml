repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types_or: [python, pyi]
      - id: prettier
        name: Prettier format
        entry: npx --no-install prettier --check --ignore-unknown
        language: system
        files: '\.(html|css|scss|js|jsx|ts|tsx|json|jsonc|md|mdx|yaml|yml)$'
        exclude: '^package-lock\.json$'
